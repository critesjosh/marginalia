resources:
  # The Observatory is a second App, deliberately separate from the serving one.
  # They differ in every way that matters: this one has a UI and no external
  # caller, reads through a warehouse rather than Postgres, and is for the
  # reader looking at their own reading rather than for the browser. Sharing an
  # app would mean sharing a service principal, and with it a grant on Gold that
  # the serving app has no business holding.
  apps:
    observatory:
      name: ${var.observatory_app_name}
      description: >-
        Eight views over one reader's own intelligence, read from Gold. No table
        holding the reader's own words is reachable from it.
      source_code_path: ../src/observatory
      resources:
        - name: ops-warehouse
          description: Reads Gold and the extraction evidence behind it.
          sql_warehouse:
            id: ${var.ops_warehouse_id}
            permission: CAN_USE
      config:
        env:
          - name: MARGINALIA_CATALOG
            value: ${var.catalog}
          - name: MARGINALIA_GOLD_SCHEMA
            value: ${resources.schemas.gold.name}
          - name: MARGINALIA_SILVER_SCHEMA
            value: ${resources.schemas.silver.name}
          - name: MARGINALIA_WAREHOUSE_HTTP_PATH
            value: /sql/1.0/warehouses/${var.ops_warehouse_id}
          # The reader whose intelligence this shows. Supplied at deploy, like
          # every other identifier that names private infrastructure. Without
          # it the Observatory refuses rather than picking somebody.
          - name: MARGINALIA_TRUSTED_USER_ID
            value: ${var.trusted_user_id}
          # Ids, not URLs: the app builds the link from its own host, so no
          # workspace address is committed or passed at deploy.
          - name: MARGINALIA_GENIE_SPACE_ID
            value: ${var.genie_space_id}
          - name: MARGINALIA_DASHBOARD_ID
            value: ${var.dashboard_id}

  dashboards:
    marginalia_dashboard:
      display_name: ${var.dashboard_name}
      file_path: ../dashboards/marginalia.lvdash.json
      warehouse_id: ${var.ops_warehouse_id}
      parent_path: ${workspace.file_path}/dashboards

  # Genie answers structured questions over Gold and nothing else. Its
  # instructions define grain, join keys, score versions, and what it cannot
  # see; the grants are what make the last of those true rather than advisory.
  genie_spaces:
    marginalia_genie:
      title: ${var.genie_space_title}
      description: >-
        Structured analytical questions over one reader's Gold profiles,
        frontier, and recommendations. No access to any table holding their
        own words.
      warehouse_id: ${var.ops_warehouse_id}
      parent_path: ${workspace.file_path}/genie
      # Inline rather than a file, because the table identifiers differ per
      # target and only an inline body gets bundle substitution. The
      # instructions and the benchmark answers are generated from
      # ../genie/marginalia.geniespace.json and ../eval/genie_questions.json,
      # and a contract test holds this in step with both.
      serialized_space:
        version: 2
        data_sources:
          tables:
            - identifier: ${var.catalog}.${resources.schemas.gold.name}.book_engagement
            - identifier: ${var.catalog}.${resources.schemas.gold.name}.intellectual_frontier
            - identifier: ${var.catalog}.${resources.schemas.gold.name}.reader_interest_profile
            - identifier: ${var.catalog}.${resources.schemas.gold.name}.recommendation_candidates
        instructions:
          text_instructions:
            - id: 735c4c0637c3949919be8e5eaee751c4
              content:
                - "You answer structured analytical questions about one reader's own reading, over curated Gold tables. Answer with SQL over these tables and nothing else.\n"
                - "\n"
                - "GRAIN. Getting this wrong is the commonest way to be confidently incorrect.\n"
                - "- reader_interest_profile is one row per user and concept. Counting its rows counts concepts, not evidence.\n"
                - "- book_engagement is one row per user and book.\n"
                - "- intellectual_frontier is one row per user and candidate concept.\n"
                - "- recommendation_candidates is one row per user and candidate work.\n"
                - "Never sum a score across rows. Every score is normalized within a reader and means nothing added together.\n"
                - "\n"
                - "JOIN KEYS.\n"
                - "- user_id joins every table.\n"
                - "- reader_interest_profile.concept_id joins intellectual_frontier.candidate_concept only as an anti-join: the frontier is defined as concepts the reader has no direct evidence for, so an inner join between them is empty by construction and is a sign the question was misread.\n"
                - "- book_engagement.book_id is the reader's own library id. It is not an Open Library or OpenAlex identifier and must never be joined to one.\n"
                - "- recommendation_candidates.candidate_id is an OpenAlex work id. Open Library work keys live elsewhere and are a different identifier space. Do not join them.\n"
                - "\n"
                - "SCORES. Report the version alongside any score you report. interest_score is reader_interest_v1, engagement_score is engagement_score_v1, frontier_score is frontier_heuristic_v1, recommendation_score is recommendation_heuristic_v1. A score from one version is not comparable with a score from another.\n"
                - "\n"
                - "FRESHNESS. Every table carries computed_at. When asked how current something is, report computed_at from the data. Never report the current time: it is always available and always wrong as an answer to that question.\n"
                - "\n"
                - "WHAT YOU CANNOT SEE. You have no access to any table holding the reader's own words: not highlight text, not notes, not conversations, not questions, not assistant replies, not book memory, and not the raw provider responses. This is a grant, not a guideline, so such a query will fail. If asked for any of that, say plainly that you cannot see it. Do not return an empty result: an empty result reads as the reader having none, which is a different and false claim.\n"
                - "\n"
                - "EVIDENCE. reader_interest_profile carries evidence_count, distinct_books, and top_source_ids; intellectual_frontier carries established_concepts, supporting_works, and supporting_work_ids; recommendation_candidates carries matched_concepts and explanation. Prefer returning these over describing them. Never invent a confidence, a citation, or a reason that is not in a column.\n"
                - "\n"
                - "UNCERTAINTY. If a question cannot be answered from these tables at this grain, say so and say what is missing. A wrong number is worse than an admission, because the reader has no way to check it.\n"
        config:
          sample_questions:
            - id: a0b942a9458c7c65026a7c6a56320e40
              question:
                - "What are my five strongest interests?"
            - id: a75cf7c2acfd1895c4fc31a9211dfdf9
              question:
                - "Which book am I most engaged with?"
            - id: c526c0a3a10978f420ac7669956276a5
              question:
                - "What concepts are at the edge of what I have read?"
            - id: 95d787808bc3d9a455303bc8b37f6400
              question:
                - "What books are recommended to me and why?"
            - id: 34b7a36272e7eb11c17e11372659caa2
              question:
                - "When was my interest profile last computed?"
        benchmarks:
          questions:
            - id: f5798b8758980f63d5e748883dcfe9d7
              question:
                - "What are my five strongest interests?"
              answer:
                - format: SQL
                  content:
                    - "SELECT concept_id, interest_score FROM ${var.catalog}.${resources.schemas.gold.name}.reader_interest_profile ORDER BY interest_score DESC, concept_id LIMIT 5"
            - id: 76891dee74aa82859e4104ec3277ddb8
              question:
                - "How many distinct concepts are in my interest profile?"
              answer:
                - format: SQL
                  content:
                    - "SELECT count(DISTINCT concept_id) AS concepts FROM ${var.catalog}.${resources.schemas.gold.name}.reader_interest_profile"
            - id: f7bab417b4f2ab743beca2083796dec6
              question:
                - "Which book am I most engaged with?"
              answer:
                - format: SQL
                  content:
                    - "SELECT book_id, engagement_score FROM ${var.catalog}.${resources.schemas.gold.name}.book_engagement ORDER BY engagement_score DESC, book_id LIMIT 1"
            - id: aa3351cd3a5da31143097f647c06def7
              question:
                - "How many highlights and questions do I have per book?"
              answer:
                - format: SQL
                  content:
                    - "SELECT book_id, current_highlights, questions FROM ${var.catalog}.${resources.schemas.gold.name}.book_engagement ORDER BY book_id"
            - id: 38390b5823091e498e25d1b9fef52ec3
              question:
                - "What concepts are at the edge of what I have read?"
              answer:
                - format: SQL
                  content:
                    - "SELECT candidate_concept, frontier_score FROM ${var.catalog}.${resources.schemas.gold.name}.intellectual_frontier ORDER BY frontier_score DESC, candidate_concept LIMIT 5"
            - id: a66f919dc1d00440afbd51039700fe5a
              question:
                - "What books are recommended to me and why?"
              answer:
                - format: SQL
                  content:
                    - "SELECT candidate_title, recommendation_score, explanation FROM ${var.catalog}.${resources.schemas.gold.name}.recommendation_candidates ORDER BY recommendation_score DESC, candidate_id LIMIT 5"
            - id: f8cb64e40a6568da7c4926d64b27394a
              question:
                - "What score versions produced my current profile?"
              answer:
                - format: SQL
                  content:
                    - "SELECT DISTINCT score_version FROM ${var.catalog}.${resources.schemas.gold.name}.reader_interest_profile ORDER BY score_version"
            - id: 9796488edcc4989c236b861070da979a
              question:
                - "When was my interest profile last computed?"
              answer:
                - format: SQL
                  content:
                    - "SELECT max(computed_at) AS computed_at FROM ${var.catalog}.${resources.schemas.gold.name}.reader_interest_profile"
            - id: 64284f3cf39c92ee57529959e8e3991e
              question:
                - "How much evidence supports my strongest concept?"
              answer:
                - format: SQL
                  content:
                    - "SELECT concept_id, evidence_count, distinct_books FROM ${var.catalog}.${resources.schemas.gold.name}.reader_interest_profile ORDER BY interest_score DESC, concept_id LIMIT 1"
