resources:
  pipelines:
    events_ingestion:
      name: marginalia-events-ingestion
      serverless: true
      # Triggered, not continuous: an update processes the available backlog and
      # stops, so cost follows event volume instead of wall-clock time.
      continuous: false
      catalog: ${var.catalog}
      # Reference the resource's resolved name so development-mode prefixes do
      # not split the schema resource from the pipeline target.
      schema: ${resources.schemas.bronze.name}
      libraries:
        - file:
            path: ../src/events_ingestion.py
      configuration:
        marginalia.kafka.secret_scope: ${var.kafka_secret_scope}
        marginalia.kafka.topic: ${var.kafka_topic}

  jobs:
    events_ingestion_schedule:
      name: marginalia-events-ingestion-schedule
      # Bronze freshness is this interval. Shortening it shortens the end-to-end
      # freshness objective and raises pipeline cost proportionally.
      schedule:
        quartz_cron_expression: 0 0/15 * * * ?
        timezone_id: UTC
      tasks:
        - task_key: ingest
          pipeline_task:
            pipeline_id: ${resources.pipelines.events_ingestion.id}
        - task_key: transform_silver
          depends_on:
            - task_key: ingest
          pipeline_task:
            pipeline_id: ${resources.pipelines.events_silver.id}
        # Extraction is a job task, not a pipeline: it calls a model, and a
        # materialized view would call it again every time Silver changed.
        - task_key: extract_concepts
          depends_on:
            - task_key: transform_silver
          spark_python_task:
            python_file: ../src/concept_extraction.py
            parameters:
              - --catalog=${var.catalog}
              - --silver_schema=${resources.schemas.silver.name}
              - --concept_endpoint=${var.concept_endpoint}
              - --extraction_batch_limit=${var.extraction_batch_limit}
          environment_key: concepts
        - task_key: build_gold
          depends_on:
            - task_key: extract_concepts
          pipeline_task:
            pipeline_id: ${resources.pipelines.gold_profiles.id}
        # Public sources come after the profiles, because what it asks Open
        # Library and OpenAlex about is decided by what the profiles say the
        # reader is interested in.
        - task_key: public_sources
          depends_on:
            - task_key: build_gold
          spark_python_task:
            python_file: ../src/public_sources.py
            parameters:
              - --catalog=${var.catalog}
              - --bronze_schema=${resources.schemas.bronze.name}
              - --silver_schema=${resources.schemas.silver.name}
              - --gold_schema=${resources.schemas.gold.name}
              - --public_contact=${var.public_contact}
              - --public_batch_limit=${var.public_batch_limit}
              - --public_request_spacing=${var.public_request_spacing}
              - --public_enrichment_ttl_days=${var.public_enrichment_ttl_days}
              - --public_failed_retry_hours=${var.public_failed_retry_hours}
          environment_key: concepts
        - task_key: build_frontier
          depends_on:
            - task_key: public_sources
          pipeline_task:
            pipeline_id: ${resources.pipelines.frontier_gold.id}
      environments:
        - environment_key: concepts
          spec:
            client: "3"
            dependencies: []
