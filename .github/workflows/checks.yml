name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run types:generate
      - name: Validate checks documented in AGENTS.md
        run: npm run check
      - run: npm run quality
      - name: Validate production build documented in AGENTS.md
        run: npm run build:cloudflare
      - run: node scripts/bundle-budget.mjs
      - run: npm audit --audit-level=moderate
      - uses: actions/upload-artifact@v6
        with:
          name: app-quality
          path: |
            coverage/
            reports/bundle.html
            reports/duplicates/

  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/narrate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/narrate/requirements-dev.txt
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Validate narrator tests documented in AGENTS.md
        run: |
          ruff check narrate tests
          ruff format --check narrate tests
          mypy
          vulture
          deptry .
          coverage run -m unittest discover -s tests -p 'test_*.py'
          coverage report
          python ../../scripts/check-contracts.py
          python ../../scripts/generate-docs.py --check

  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:qa
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: browser-qa
          path: |
            playwright-report/
            test-results/
