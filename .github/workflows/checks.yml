name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run types:generate
      - name: Validate checks documented in AGENTS.md
        run: npm run check
      - run: npm run quality
      - run: npm run docs:check
      - name: Validate production build documented in AGENTS.md
        run: npm run build:cloudflare
      - run: node scripts/bundle-budget.mjs
      - run: npm audit --audit-level=moderate
      - uses: actions/upload-artifact@v7
        with:
          name: app-quality
          path: |
            coverage/
            reports/bundle.html
            reports/duplicates/

  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Runner package mirrors occasionally stall; retry rather than hit the job timeout.
      - run: |
          for attempt in 1 2 3; do
            timeout 240 npx playwright install --with-deps chromium firefox webkit && exit 0
            echo "Playwright install attempt $attempt failed"
          done
          exit 1
      - run: npm run test:qa
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-qa
          path: |
            playwright-report/
            test-results/
