name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test

  narrate:
    # The timeline arithmetic lives here and nothing in the app's suite reaches
    # it, so a break would otherwise only show up in a published sync map.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/narrate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/narrate/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t .
