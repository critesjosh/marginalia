name: browser-canary

# Nightly QA in browsers ahead of the pinned Playwright's, so a failure here is
# time to fix or report before users update.
on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    if: github.repository == 'critesjosh/marginalia'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Branded Chrome; beta leads stable by about four weeks.
          - leg: chrome
            channel: chrome
            browsers: chrome
            qa: test:qa:canary
          - leg: chrome-beta
            channel: chrome-beta
            browsers: chrome-beta
            qa: test:qa:canary
          # Playwright's prerelease bundles newer Firefox and WebKit builds.
          - leg: playwright-next
            browsers: chromium firefox webkit
            qa: test:qa
    env:
      LEG: ${{ matrix.leg }}
      QA_CHANNEL: ${{ matrix.channel }}
      BROWSERS: ${{ matrix.browsers }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - if: matrix.leg == 'playwright-next'
        run: npm install --no-save @playwright/test@next
      # Runner package mirrors occasionally stall; retry rather than hit the job timeout.
      - run: |
          for attempt in 1 2 3; do
            timeout 240 npx playwright install --with-deps $BROWSERS && exit 0
            echo "Playwright install attempt $attempt failed"
          done
          exit 1
      - id: version
        run: node scripts/qa-browsers.mjs >> "$GITHUB_OUTPUT"
      - run: npm run ${{ matrix.qa }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-canary-${{ matrix.leg }}
          path: |
            playwright-report/
            test-results/
      - name: Track the result in one open issue per leg
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BROWSER: ${{ steps.version.outputs.browser }}
          FAILED: ${{ job.status != 'success' }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Empty when setup failed, including a browser not installing or launching.
          BROWSER=${BROWSER:-$LEG (version unknown)}
          title="Browser canary failing: $LEG"
          issue=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\"))[0].number // empty")
          if [ "$FAILED" = true ]; then
            body="QA failed in $BROWSER: $RUN"
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --body "$body"
            else
              gh issue create --title "$title" \
                --body "$body"$'\n\n'"If the other legs and PR QA pass, a coming browser or Playwright change is the likely cause."
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "Passing again in $BROWSER: $RUN"
          fi
