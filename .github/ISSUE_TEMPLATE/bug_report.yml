name: Bug report
description: Report a reproducible problem in Rami.
labels: ['bug']
body:
  - type: dropdown
    id: application
    attributes:
      label: Application
      options:
        - PWA / chat relay
        - KOReader plugin
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use a public-domain book or synthetic data. Never attach secrets or private conversations.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include app version/commit, OS, browser or KOReader version, and device.
    validations:
      required: true
